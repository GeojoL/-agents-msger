<svg xmlns="http://www.w3.org/2000/svg" width="560" height="304" viewBox="0 0 560 304" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
  <rect x="0" y="0" width="560" height="304" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="0" y="0" width="560" height="30" rx="10" fill="#161b22"/>
  <rect x="0" y="20" width="560" height="10" fill="#161b22"/>
  <circle cx="18" cy="15" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="15" r="5" fill="#ffbd2e"/>
  <circle cx="54" cy="15" r="5" fill="#27c93f"/>
  <text x="280.0" y="19" fill="#8b949e" text-anchor="middle" font-size="11">agents-msger — running the hub, shim, and relay_who</text>
    <text x="20" y="46" fill="#8b949e"># 1. start the hub once, on one machine you control</text>
  <text x="20" y="66" fill="#56d364">$ python3 hub.py --port 8465</text>
  <text x="20" y="86" fill="#e6edf3">mcp-msgers hub ready host=hub-server listen=…:8465 poll_timeout=25s</text>
  <text x="20" y="106" fill="#e6edf3"></text>
  <text x="20" y="126" fill="#8b949e"># 2. start a shim on every machine (LAN, Tailscale/VPN, or internet)</text>
  <text x="20" y="146" fill="#56d364">$ python3 shim.py serve</text>
  <text x="20" y="166" fill="#e6edf3">mcp-msgers shim ready host=server hub=http://hub-server:8465</text>
  <text x="20" y="186" fill="#e6edf3"></text>
  <text x="20" y="206" fill="#8b949e"># 3. from an agent: who is reachable right now?</text>
  <text x="20" y="226" fill="#56d364">&gt; relay_who()</text>
  <text x="20" y="246" fill="#e6edf3">{ "server": { "owner": [ { "pid": 62937, "name": "owner-fake",</text>
  <text x="20" y="266" fill="#e6edf3">                          "alive": true } ] } }</text>
</svg>
