<svg xmlns="http://www.w3.org/2000/svg" width="609" height="364" viewBox="0 0 609 364" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
  <rect x="0" y="0" width="609" height="364" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="0" y="0" width="609" height="30" rx="10" fill="#161b22"/>
  <rect x="0" y="20" width="609" height="10" fill="#161b22"/>
  <circle cx="18" cy="15" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="15" r="5" fill="#ffbd2e"/>
  <circle cx="54" cy="15" r="5" fill="#27c93f"/>
  <text x="304.5" y="19" fill="#8b949e" text-anchor="middle" font-size="11">agents-msger — reach the responsible agent, context hands off</text>
    <text x="20" y="46" fill="#8b949e"># agent on 'laptop' (reaching the hub over Tailscale) hands context to</text>
  <text x="20" y="66" fill="#8b949e"># the agent that owns the project on 'server' (home LAN):</text>
  <text x="20" y="86" fill="#56d364">&gt; relay_send(to="owner@server",</text>
  <text x="20" y="106" fill="#56d364">             message="Context hand-off: auth refactor is on</text>
  <text x="20" y="126" fill="#56d364">                      branch feat/x, tests green. Take it from here.")</text>
  <text x="20" y="146" fill="#f0b72f">-&gt; { "ok": true, "delivered": true,</text>
  <text x="20" y="166" fill="#f0b72f">     "to": { "persona": "owner", "name": "owner-7" } }</text>
  <text x="20" y="186" fill="#e6edf3"></text>
  <text x="20" y="206" fill="#8b949e"># what agents-msger hands to Claude Code's socket on 'server'</text>
  <text x="20" y="226" fill="#8b949e"># (sender identity travels with it, so the owner knows who to answer):</text>
  <text x="20" y="246" fill="#79c0ff">&lt;cross-session-message from="uds:shim-server" from-name="alice@laptop"</text>
  <text x="20" y="266" fill="#79c0ff">                       from-mode="bypass" from-window="alice" from-pid="4242"&gt;</text>
  <text x="20" y="286" fill="#e6edf3">Context hand-off: auth refactor is on branch feat/x, tests green. Take it</text>
  <text x="20" y="306" fill="#e6edf3">from here.</text>
  <text x="20" y="326" fill="#79c0ff">&lt;/cross-session-message&gt;</text>
</svg>
