<svg xmlns="http://www.w3.org/2000/svg" width="653" height="284" viewBox="0 0 653 284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
  <rect x="0" y="0" width="653" height="284" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="0" y="0" width="653" height="30" rx="10" fill="#161b22"/>
  <rect x="0" y="20" width="653" height="10" fill="#161b22"/>
  <circle cx="18" cy="15" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="15" r="5" fill="#ffbd2e"/>
  <circle cx="54" cy="15" r="5" fill="#27c93f"/>
  <text x="326.5" y="19" fill="#8b949e" text-anchor="middle" font-size="11">agents-msger — reach the responsible agent, context hands off</text>
    <text x="20" y="46" fill="#8b949e"># an agent on 'laptop' hands context to whoever owns the project on 'server'</text>
  <text x="20" y="66" fill="#56d364">&gt; relay_send(to="owner@server",</text>
  <text x="20" y="86" fill="#56d364">             message="Context hand-off: auth refactor is on</text>
  <text x="20" y="106" fill="#56d364">                      branch feat/x, tests green. Take it from here.")</text>
  <text x="20" y="126" fill="#f0b72f">-&gt; { "ok": true, "delivered": true,</text>
  <text x="20" y="146" fill="#f0b72f">     "to": { "persona": "owner", "name": "owner-fake" } }</text>
  <text x="20" y="166" fill="#e6edf3"></text>
  <text x="20" y="186" fill="#8b949e"># what the responsible agent sees in its session, on its next turn:</text>
  <text x="20" y="206" fill="#f0b72f">&lt;cross-session-message from-name="alice@laptop" from-window="alice" from-pid="4242"&gt;</text>
  <text x="20" y="226" fill="#e6edf3">Context hand-off: auth refactor is on branch feat/x, tests green. Take it from here.</text>
  <text x="20" y="246" fill="#f0b72f">&lt;/cross-session-message&gt;</text>
</svg>
