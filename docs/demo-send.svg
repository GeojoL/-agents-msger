<svg xmlns="http://www.w3.org/2000/svg" width="560" height="284" viewBox="0 0 560 284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
  <rect x="0" y="0" width="560" height="284" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="0" y="0" width="560" height="30" rx="10" fill="#161b22"/>
  <rect x="0" y="20" width="560" height="10" fill="#161b22"/>
  <circle cx="18" cy="15" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="15" r="5" fill="#ffbd2e"/>
  <circle cx="54" cy="15" r="5" fill="#27c93f"/>
  <text x="280.0" y="19" fill="#8b949e" text-anchor="middle" font-size="11">agents-msger — reach the responsible agent, context hands off</text>
    <text x="20" y="46" fill="#8b949e"># agent on 'laptop' (reaching the hub over Tailscale) hands context to</text>
  <text x="20" y="66" fill="#8b949e"># the agent that owns the project on 'server' (home LAN):</text>
  <text x="20" y="86" fill="#56d364">&gt; relay_send(to="owner@server",</text>
  <text x="20" y="106" fill="#56d364">             message="Context hand-off: auth refactor is on</text>
  <text x="20" y="126" fill="#56d364">                      branch feat/x, tests green. Take it from here.")</text>
  <text x="20" y="146" fill="#f0b72f">-&gt; { "ok": true, "delivered": true,</text>
  <text x="20" y="166" fill="#f0b72f">     "to": { "persona": "owner", "name": "owner-7" } }</text>
  <text x="20" y="186" fill="#e6edf3"></text>
  <text x="20" y="206" fill="#8b949e"># how Claude Code surfaces it in the owner's session, on its next turn:</text>
  <text x="20" y="226" fill="#79c0ff">&gt; Message from @alice@laptop: Context hand-off: auth refactor is on</text>
  <text x="20" y="246" fill="#79c0ff">  branch feat/x, tests green. Take it from here.  (ctrl+o to expand)</text>
</svg>
