<svg xmlns="http://www.w3.org/2000/svg" width="600" height="377" viewBox="0 0 600 377" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5"><g><rect x="0" y="0" width="600" height="170" rx="10" fill="#0d1117" stroke="#30363d"/><rect x="0" y="0" width="600" height="30" rx="10" fill="#161b22"/><rect x="0" y="20" width="600" height="10" fill="#161b22"/><circle cx="18" cy="15" r="5" fill="#ff5f56"/><circle cx="36" cy="15" r="5" fill="#ffbd2e"/><circle cx="54" cy="15" r="5" fill="#27c93f"/><text x="300.0" y="19" fill="#8b949e" text-anchor="middle" font-size="11">alice — laptop  (the asking agent)</text><text x="18" y="48" fill="#56d364">❯ Hand the auth refactor off to the agent that owns it on the server,</text><text x="18" y="67" fill="#56d364">  and confirm the round-trip.</text><text x="18" y="86" fill="#a371f7">⏺ Called relay_send(to="bob@server")</text><text x="18" y="105" fill="#f0b72f">  → { ok: true, delivered: true, to: { persona: "bob", name: "bob-3" } }</text><text x="18" y="124" fill="#79c0ff">‹ Message from @bob-server: Ack from bob@server — hand-off received,</text><text x="18" y="143" fill="#e6edf3">  feat/x auth refactor (tests green) noted. Round-trip confirmed.</text></g><g transform="translate(0,188)"><rect x="0" y="0" width="600" height="189" rx="10" fill="#0d1117" stroke="#30363d"/><rect x="0" y="0" width="600" height="30" rx="10" fill="#161b22"/><rect x="0" y="20" width="600" height="10" fill="#161b22"/><circle cx="18" cy="15" r="5" fill="#ff5f56"/><circle cx="36" cy="15" r="5" fill="#ffbd2e"/><circle cx="54" cy="15" r="5" fill="#27c93f"/><text x="300.0" y="19" fill="#8b949e" text-anchor="middle" font-size="11">bob — server  (the agent responsible for the project)</text><text x="18" y="48" fill="#79c0ff">› Message from @alice-laptop: Context hand-off: the auth refactor is on</text><text x="18" y="67" fill="#e6edf3">  branch feat/x and its tests are green — please take it from here…</text><text x="18" y="86" fill="#8b949e">                                                        (ctrl+o to expand)</text><text x="18" y="105" fill="#a371f7">⏺ A hand-off from alice@laptop asking me to confirm the round-trip —</text><text x="18" y="124" fill="#e6edf3">  I’ll reply via the relay.</text><text x="18" y="143" fill="#a371f7">⏺ Called relay_send(to="alice")  → delivered: true, routed to alice-7.</text><text x="18" y="162" fill="#e6edf3">  Done — acknowledgement delivered to alice.</text></g></svg>
